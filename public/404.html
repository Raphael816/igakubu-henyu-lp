<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDTHOD SCHOOL</title>
    <!--
      GitHub Pagesは静的ホスティングのため、/courses のような実パスへ直接アクセスされたり
      リロードされたりすると本来404になる。このスクリプトはその404.htmlの内容をクエリ文字列に
      エンコードしてindex.htmlへリダイレクトし、index.html側の対になるスクリプトで元のパスへ
      復元する(https://github.com/rafgraph/spa-github-pages と同じ標準的な手法)。
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
