    <title>MEDTHOD SCHOOL｜医学部学士編入 個別伴走塾</title>
    <meta name="description" content="医学部学士編入試験を目指す大学生・大学院生・社会人のための個別伴走塾。英語・生命科学の指導、学習計画、答案添削、志望校選定、面接対策まで。無料相談はLINEから。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // 404.htmlでエンコードされたパスを、React Routerが解釈できる本来のパスへ復元する(spa-github-pages方式の対)。
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
